name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shalzz/zola-deploy-action@v0.21.0
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
