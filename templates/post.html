{% extends "austere-theme-zola/templates/post.html" %}

{% block body_end %}
{{ super() }}
{%- if 'data-lang="mermaid"' in page.content %}
<style>.mermaid{display:flex;justify-content:center;margin:0 0 1.5rem}.mermaid svg{max-width:100%;height:auto}</style>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

// Swap each ```mermaid code block for a container holding its raw source
const nodes = [...document.querySelectorAll('pre > code[data-lang="mermaid"]')].map((code) => {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.dataset.src = code.textContent;
  code.parentElement.replaceWith(div);
  return div;
});

// Render in the theme's current light/dark mode, and again when it is toggled
async function render() {
  const dark = document.documentElement.classList.contains("dark");
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
  nodes.forEach((n) => { n.removeAttribute("data-processed"); n.textContent = n.dataset.src; });
  await mermaid.run({ nodes });
}
render();
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
</script>
{%- endif %}
{% endblock body_end %}
