# The URL the site will be built for
base_url = "https://andreiblt.github.io/blog"

# Theme in themes/austere-theme-zola
theme = "austere-theme-zola"

title = "Andrei Baltariu"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]

[markdown.highlighting]
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"
# Code blocks follow the site's theme toggle rather than the OS setting
add_color_scheme = false

[extra]
# Put all your custom variables here
strapline = ""
footer_text = ""
menu_links = [
  { url = "$BASE_URL/", name = "Home" },
  { url = "$BASE_URL/blog/", name = "Blog" },
]

# Inline the theme's SVG icons; its <img> fallback uses root-absolute paths that break under /blog
inline_icons = true
icon_path = "themes/austere-theme-zola/static/icons/"
